name: Update data
on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests numpy androguard pyzipper pyyaml
      - name: Build lists
        timeout-minutes: 15
        run: python build_data.py lists
        env:
          ABUSE_KEY: ${{ secrets.ABUSE_KEY }}
          FULL_URL: ${{ secrets.FULL_URL }}
      - name: Save lists
        run: |
          git config user.name "hawkeye-bot"
          git config user.email "bot@users.noreply.github.com"
          git add apk_hashes.txt bad_urls.txt model.json stats.json 2>/dev/null || true
          git commit -m "Update lists" || echo "nothing changed"
          git pull --rebase origin main
          git push
      - name: Train model
        continue-on-error: true
        timeout-minutes: 30
        run: python build_data.py model
        env:
          ABUSE_KEY: ${{ secrets.ABUSE_KEY }}
      - name: Save model
        run: |
          git add apk_hashes.txt bad_urls.txt model.json stats.json 2>/dev/null || true
          git commit -m "Update model" || echo "nothing changed"
          git pull --rebase origin main
          git push
